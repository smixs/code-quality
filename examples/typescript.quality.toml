# code-quality config, TypeScript. Copy to <repo>/.quality.toml, then
#   bun ~/.claude/skills/code-quality/scripts/quality.ts install-hooks <repo>
# Every key the skill understands, with one bar for every repo.

[project]
language = "ts"
src = ["src", "scripts"]
# Leave base out to detect it from origin/HEAD (then origin/main, origin/master, main); the report
# header marks a detected base.
base = "origin/main"
# Where every report, the baseline, allow.md and the logs go. Default .scratch/quality.
# out_dir = ".scratch/quality"
# Cache for the npm tools the gate installs itself. QG_TOOLS wins over it.
# tools_dir = "~/.cache/quality-gate"
# Full gate (quality.ts without a command). Must write lcov to $QG_LCOV.
test_cmd = 'node --test --test-concurrency=4 --experimental-test-coverage --test-coverage-include="src/**/*.ts" --test-coverage-include="scripts/**/*.ts" --test-coverage-exclude="**/*.test.ts" --test-coverage-exclude="scripts/fixtures/**/*.ts" --test-reporter=lcov --test-reporter-destination="$QG_LCOV" --test-reporter=spec --test-reporter-destination=stdout "src/**/*.test.ts" "scripts/**/*.test.ts"'

[thresholds]
# One bar for every repo. Listed here so a reader sees them next to the rules.
max_cc = 10
max_crap = 30
# Diagnostic warning threshold. It never changes the gate exit code.
max_mean_crap = 5
mean_tolerance = 0.01
cognitive_complexity = 15
max_depth = 4
max_params = 4
max_lines_per_function = 80
dup_min_tokens = 70
diff_coverage = 0.8
min_release_age_days = 1

[layers]
# Application code must not import the build and tooling scripts.
forbid = ["^src/:^scripts/"]

[knip]
ignore = ["scripts/fixtures/**", "scripts/**/*.test.ts"]

[glossary]
path = "CONTEXT.md"
marker = "_Avoid_:"
# Lines with a qualifier are skipped by the script: they name a sense, not a word. allow = plain-line
# words that are still homonyms in this repo (npm overrides, system cron, a schedule Job, a poller).
allow = ["cron", "override", "job", "poller", "transport", "registry"]
# Prose people and agents write. CHANGELOG quotes history and is left out.
globs = ["README.md", "AGENTS.md", "CONTEXT.md", "CONTRIBUTING.md", "SECURITY.md", "docs/**/*.md", "src/**/*.md"]
commit_msg = true

[docs]
# Every backticked repo path / path:line / code symbol in these files must exist. CHANGELOG is history.
globs = ["README.md", "AGENTS.md", "CONTEXT.md", "CONTRIBUTING.md", "SECURITY.md", "CLAUDE.md", "docs/**/*.md", "src/**/*.md"]
# ADRs and changelogs record removals: symbols and paths they name may be gone on purpose.
history_globs = ["docs/adr/**", "CHANGELOG.md", "**/CHANGELOG.md"]

[secrets]
# Names that are service users of a self-hosted box (systemd units, docs), not developer machines.
allow_users = ["deploy", "ci"]

[security]
gitleaks = true
audit = true
# Registry per ecosystem for deps/lock-age: point one at a mirror, or "" to skip that ecosystem.
# Known ids: npm, pypi, crates, go, rubygems, packagist, pub, nuget, maven, deps.dev.
# registry_urls = { npm = "https://mirror.local/npm/{name}" }

[escalate]
# Security-sensitive paths: always a reviewer once it is wired.
paths = ["**/*auth*", "**/*security*", "docs/adr/**"]

[hooks]
pre_push_test_cmd = "node --test --test-concurrency=4 {files}"
pre_push_timeout = 180
pre_push_max_tests = 40

[tools]
# Overrides for the pinned external tools (ids in scripts/lib/tools.ts). A bare value is a version,
# a value with a path separator a binary path. Unknown ids are a config error.
# jscpd = "5.3.0"
# gitleaks = "/opt/bin/gitleaks"

[review]
# Jev notes on added test hunks (SKILL.md "Jev"). Notes only, never block. Thresholds are advisory.
jev = true
# auto = TypeSafe when TYPESAFE_API_KEY is set, else OpenRouter when OPENROUTER_API_KEY is set.
# typesafe -> https://api.typesafe.ai/v1/systemone, TYPESAFE_API_KEY, model jev-1.13.0
# openrouter -> https://openrouter.ai/api/alpha/decisions, OPENROUTER_API_KEY, model typesafe/jev-1.13-20260917
# custom -> jev_url, jev_key_env and jev_model are all required.
jev_provider = "auto"
# jev_url = "https://api.typesafe.ai/v1/systemone"
# jev_key_env = "TYPESAFE_API_KEY"
# jev_model = "jev-1.13.0"
jev_max_states = 12
textual_test = true
textual_test_threshold = 0.85
error_path_tested = true
error_path_tested_threshold = 0.5
assertion_weakened = true
assertion_weakened_threshold = 0.7
mock_hides_behavior = true
mock_hides_behavior_threshold = 0.7
property_is_tautology = true
property_tautology_threshold = 0.7
# Changed source hunks: is the change tested in this diff (a note below the threshold).
change_untested = true
change_untested_threshold = 0.5
# The task spec, a path in the repo; empty = $QG_SPEC; neither = "jev: spec not set".
# spec = "docs/specs/task.md"
spec_incomplete = true
spec_incomplete_threshold = 0.7
# UX pack on interface files and translation dictionaries; both lists empty = off.
# ux_globs = ["src/components/**/*.tsx", "src/pages/**/*.tsx"]
# i18n_globs = ["src/i18n/*.json"]
# ux_off = ["mobile_not_handled"]
ux_threshold = 0.7
# Agent pack for AI assistant and agent code: code globs and prompt/instruction globs; empty = off.
# agent_globs = ["agent/**/*.ts"]
# agent_prompt_globs = ["agent/prompts/**/*.md"]
# agent_off = ["per_vendor_branch"]
agent_threshold = 0.7
llm = false

# Project questions: rules of this repository that no built-in question covers. Asked on hunks of
# files matching `files` (tests excluded) with an added line matching `trigger`. Adapt or delete.
[[review.jev_questions]]
id = "hint_as_visible_text"
files = ["src/components/**/*.tsx"]
trigger = "<(?:HelpText|FormDescription|FieldDescription)\\b"
instructions = "Does `source_hunk` add an explanation of a field, card or switch as permanent visible text next to it, instead of behind an information icon with a tooltip or popover?"
criteria = { true = "An added description explains what a control is, where its value comes from or what it does, and it is always visible.", false = "The explanation sits behind an information icon, or the visible text warns about an irreversible action or states a format limit." }
note = "a field explanation is visible text, not behind an info icon"

[[review.jev_questions]]
id = "open_button_instead_of_row_click"
files = ["src/components/**/*.tsx", "src/pages/**/*.tsx"]
trigger = ">\\s*Open\\s*<|[\"']Open[\"']|<Dialog\\b"
instructions = "Does `source_hunk` open a table record through a separate Open button or a modal Dialog instead of a click on the row that opens a side sheet?"
criteria = { true = "The hunk adds an Open button, an actions column with only Open, or a Dialog to view or edit a table record.", false = "Rows open a side sheet on click, or the Dialog only confirms a destructive action, or no table record is opened." }
note = "a table record opens by an Open button or a Dialog, not by a row click"
