<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Quality gate output: GATE FAIL (3) with three tamper findings, next to GATE PASS">
  <rect width="1600" height="900" fill="#0b0b0c"/>
  <rect x="0" y="0" width="1600" height="6" fill="#ff4d4d"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
    <text x="80" y="86" font-size="18" letter-spacing="6" fill="#6b6b72">QUALITY GATE</text>
    <text x="1520" y="86" font-size="18" letter-spacing="6" fill="#6b6b72" text-anchor="end">DETERMINISTIC</text>
    <line x1="80" y1="116" x2="1520" y2="116" stroke="#232327" stroke-width="1"/>

    <text x="80" y="288" font-size="88" font-weight="700" fill="#ff4d4d">GATE FAIL (3)</text>
    <text x="1520" y="288" font-size="88" font-weight="700" fill="#3ddc84" text-anchor="end">GATE PASS</text>
    <text x="1520" y="330" font-size="18" letter-spacing="3" fill="#6b6b72" text-anchor="end">0 FINDINGS</text>

    <line x1="80" y1="392" x2="1520" y2="392" stroke="#232327" stroke-width="1"/>

    <g font-size="22">
      <text x="80" y="500" fill="#4a4a52">01</text>
      <text x="180" y="500"><tspan fill="#ff4d4d">tamper/test-skipped</tspan><tspan fill="#d7d7db">  tests/queue.test.ts:12</tspan><tspan fill="#8a8a92">  test was skipped, focused, or marked todo/xfail</tspan></text>

      <text x="80" y="600" fill="#4a4a52">02</text>
      <text x="180" y="600"><tspan fill="#ff4d4d">tamper/assertion-weakened</tspan><tspan fill="#d7d7db">  tests/queue.test.ts:48</tspan><tspan fill="#8a8a92">  fewer assertions in hunk</tspan></text>

      <text x="80" y="700" fill="#4a4a52">03</text>
      <text x="180" y="700"><tspan fill="#ff4d4d">tamper/baseline-touched</tspan><tspan fill="#d7d7db">  .scratch/quality/baseline.json:1</tspan><tspan fill="#8a8a92">  quality baseline changed</tspan></text>
    </g>

    <line x1="80" y1="790" x2="1520" y2="790" stroke="#232327" stroke-width="1"/>
    <text x="80" y="838" font-size="16" letter-spacing="2" fill="#4a4a52">tamper &#183; cov/diff &#183; crap &#183; secrets &#183; deps &#183; docs &#183; glossary</text>
    <text x="1520" y="838" font-size="16" letter-spacing="2" fill="#4a4a52" text-anchor="end">exit 1</text>
  </g>
</svg>
